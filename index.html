<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joon 3D Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      height: 100%;
      padding: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    #viewer {
      width: 100%;
      height: 100%;
      min-height: 320px;
    }

    .video-wrap {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    video {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #000;
      max-height: calc(100vh - 140px);
    }

    .hint {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .hint code {
      color: var(--accent);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1.2fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <header class="panel-header">
        <h1 class="panel-title">animated_joon.glb (three.js)</h1>
        <span id="glbStatus" class="status">로딩 준비 중...</span>
      </header>
      <div id="viewer"></div>
    </section>

    <section class="panel">
      <header class="panel-header">
        <h2 class="panel-title">joon.mov</h2>
      </header>
      <div class="video-wrap">
        <video controls playsinline preload="metadata">
          <source src="./assets/joon.mov" type="video/quicktime" />
          브라우저가 MOV 재생을 지원하지 않습니다.
        </video>
        <p class="hint">
          일부 브라우저는 <code>.mov</code> 재생을 지원하지 않을 수 있습니다.
          GitHub Pages에서 호환성이 필요하면 <code>.mp4(H.264)</code>도 함께 올리는 것을 권장합니다.
        </p>
      </div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";

    const viewerEl = document.getElementById("viewer");
    const glbStatusEl = document.getElementById("glbStatus");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1720);

    const camera = new THREE.PerspectiveCamera(
      45,
      viewerEl.clientWidth / Math.max(1, viewerEl.clientHeight),
      0.01,
      1000
    );
    camera.position.set(0.9, 1.3, 2.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewerEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(2, 3, 1);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xa7c7ff, 0.45);
    fillLight.position.set(-2, 1.5, -1);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(6, 24, 0x2f4154, 0x1a2632);
    grid.position.y = 0;
    scene.add(grid);

    const loader = new GLTFLoader();
    const clock = new THREE.Clock();
    const mixers = [];

    loader.load(
      "./assets/animated_joon.glb",
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 0.001);

        model.position.sub(center);
        model.position.y += size.y * 0.5;

        const distance = maxDim * 1.6;
        camera.position.set(distance * 0.4, distance * 0.7, distance);
        controls.target.set(0, size.y * 0.4, 0);
        controls.update();

        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
          mixers.push(mixer);
          glbStatusEl.textContent = `GLB 로드 완료 (애니메이션 ${gltf.animations.length}개)`;
        } else {
          glbStatusEl.textContent = "GLB 로드 완료 (애니메이션 없음)";
        }
      },
      undefined,
      (error) => {
        console.error(error);
        glbStatusEl.textContent = "GLB 로드 실패 - 경로를 확인하세요.";
      }
    );

    window.addEventListener("resize", () => {
      const width = viewerEl.clientWidth;
      const height = Math.max(1, viewerEl.clientHeight);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      mixers.forEach((mixer) => mixer.update(delta));
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
